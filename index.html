<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>...</title>
 
    <!-- Fonts & Icons -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Raleway:wght@700;800&display=swap%22
      rel="stylesheet"
    />
<link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
 
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "IBM Plex Mono", monospace;
      }
 
      body {
        background-color: #070809;
        color: #ffffff;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 0 20px 60px;
      }
 
      /* Navbar */
      nav {
        width: 100%;
        max-width: 1110px;
        height: 70px;
        background: #1b1b1b;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-top: none;
        border-radius: 0 0 10px 10px;
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        align-items: center;
        margin-bottom: 75px;
      }
 
      .nav-item {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100%;
      }
 
      .nav-item a {
        color: #9c9c9c;
        text-decoration: none;
        font-size: 14px;
        font-weight: 400;
        letter-spacing: 0.01em;
        white-space: nowrap;
        transition: color 0.2s ease;
      }
 
      .nav-item a:hover,
      .nav-item a.active {
        color: #ffffff;
      }
 
      .social-group {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 18px;
      }
 
      .social-group a {
        color: #9c9c9c;
        font-size: 15px;
        text-decoration: none;
        transition: color 0.2s ease;
      }
 
      .social-group a:hover {
        color: #ffffff;
      }
 
      /* Main Container ล็อกขนาด 920px ตามเส้นแดง */
      .container {
        width: 100%;
        max-width: 920px;
        display: flex;
        flex-direction: column;
      }
 
      /* Hero Section จัดสมมาตรซ้าย-ขวา */
      .hero {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 70px;
      }
 
      .hero-content {
        flex: 1;
        max-width: 480px;
      }
 
      .student-id {
        font-family: "Raleway", sans-serif;
        font-size: 44px;
        font-weight: 800;
        line-height: 1.1;
        color: #ffffff;
        margin-bottom: 8px;
        letter-spacing: 0px;
        font-variant-numeric: lining-nums;
        -moz-font-feature-settings: "lnum" 1;
        -webkit-font-feature-settings: "lnum" 1;
        font-feature-settings: "lnum" 1;
      }
 
      .student-name {
        font-family: "Raleway", sans-serif;
        font-size: 44px;
        font-weight: 800;
        line-height: 1.1;
        color: #ffffff;
        margin-bottom: 22px;
        letter-spacing: 0px;
      }
 
      .hero-description {
        font-family: "IBM Plex Mono", monospace;
        color: #9c9c9c;
        font-size: 14px;
        line-height: 1.65;
        margin-bottom: 30px;
        max-width: 470px;
      }
 
      .btn-glow {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        background: linear-gradient(180deg, #4da30a 0%, #3d8807 100%);
        color: #ffffff;
        text-decoration: none;
        font-size: 14px;
        font-weight: 600;
        padding: 12px 24px;
        border-radius: 6px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        box-shadow: 0 0 25px rgba(77, 163, 10, 0.45);
        transition: 0.2s;
      }
 
      .btn-glow:hover {
        transform: translateY(-2px);
        box-shadow: 0 0 35px rgba(77, 163, 10, 0.65);
      }
 
      /* รูปโปรไฟล์วงกลม ชิดขอบขวา */
      .hero-image-wrapper {
        flex-shrink: 0;
        width: 380px;
        height: 380px;
        border-radius: 50%;
        overflow: hidden;
      }
 
      .hero-image-wrapper img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
 
      /* Worked With Section ขนาด 920x60 px */
      .worked-with {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
 
      .worked-with-title {
        font-size: 14px;
        color: #ffffff;
      }
 
      /* แบ่ง 5 กล่องเท่ากันเป๊ะ รวมกันได้กว้าง 920px */
      .brand-list {
        width: 100%;
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 16px;
      }
 
      .brand-item {
        height: 60px;
        background: #000;
        border: 1px solid #1e2024;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 16px;
        transition: border-color 0.2s ease;
      }
 
      .brand-item:hover {
        border-color: #2e323b;
      }
 
      .brand-item img {
        max-width: 100%;
        max-height: 22px;
        object-fit: contain;
        display: block;
      }
 
      /* Responsive */
      @media (max-width: 960px) {
        nav {
          height: auto;
          grid-template-columns: repeat(3, 1fr);
          gap: 16px;
          padding: 16px 10px;
        }
        .hero {
          flex-direction: column-reverse;
          text-align: center;
          gap: 32px;
        }
        .hero-content {
          display: flex;
          flex-direction: column;
          align-items: center;
        }
        .hero-image-wrapper {
          width: 260px;
          height: 260px;
        }
        .brand-list {
          grid-template-columns: repeat(2, 1fr);
        }
      }
</style>
</head>
<body>
<!-- Navbar -->
<nav>
<div class="nav-item">
<a href="#">Home</a>
</div>
<div class="nav-item">
<a href="#">Case Studies</a>
</div>
<div class="nav-item">
<a href="#">Testimonials</a>
</div>
<div class="nav-item">
<a href="#">Recent work</a>
</div>
<div class="nav-item">
<a href="#">Get In Touch</a>
</div>
<div class="nav-item social-group">
<a href="#" title="LinkedIn"><i class="fa-brands fa-linkedin-in"></i></a>
<a href="#" title="Behance"><i class="fa-brands fa-behance"></i></a>
<a href="#" title="Twitter"><i class="fa-brands fa-twitter"></i></a>
</div>
</nav>
 
    <!-- Main Container (920px) -->
<div class="container">
<!-- Hero Section -->
<section class="hero">
<div class="hero-content">
<h1 class="student-id">6619410003</h1>
<h2 class="student-name">Anucha Saelim</h2>
 
          <p class="hero-description">
            Lorem ipsum dolor sit amet consectetur adipisicing elit. Nesciunt
            rem odit labore unde nemo omnis sequi hic sit laudantium repellendus
            recusandae vitae ea laborum, ipsa nisi eos autem.
</p>
 
          <a href="#" class="btn-glow">
            Let's get started <i class="fa-solid fa-chevron-right"></i>
</a>
</div>
 
        <div class="hero-image-wrapper">
<img src="./images/p1.jpg" alt="Avatar" />
</div>
</section>
 
      <!-- Worked With Section -->
<section class="worked-with">
<span class="worked-with-title">Worked with</span>
<div class="brand-list">
<div class="brand-item">
<img src="./images/logo1.png" alt="ClickUp" />
</div>
<div class="brand-item">
<img src="./images/logo2.png" alt="Dropbox" />
</div>
<div class="brand-item">
<img src="./images/logo3.png" alt="PAYCHEX" />
</div>
<div class="brand-item">
<img src="./images/logo4.png" alt="elastic" />
</div>
<div class="brand-item">
<img src="./images/logo5.png" alt="stripe" />
</div>
</div>
</section>
</div>
</body>
</html>
