<!DOCTYPE html>
<html lang="th">
<head>
  <!-- ส่วนตั้งค่าพื้นฐานของหน้าเว็บ -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio - About</title>
 
  <!-- เรียกใช้ Tailwind CSS ผ่าน CDN (เพื่อความสะดวกในการตกแต่งคลาส) -->
  <script src="https://cdn.tailwindcss.com"></script>
 
  <!-- นำเข้าฟอนต์จาก Google Fonts (Inter & Lora) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lora:wght@700&display=swap" rel="stylesheet" />
 
  <!-- นำเข้าไอคอนจาก Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
 
  <!-- ตั้งค่า Config ของ Tailwind สำหรับกำหนดฟอนต์และสีเอง -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Inter"', 'sans-serif'],
            lora: ['"Lora"', 'serif'],
          },
          colors: {
            bgDark: '#080808', /* สีพื้นหลังหลัก */
          }
        }
      }
    }
  </script>
</head>

<!-- กำหนดสีพื้นหลังและสีตัวอักษรของทั้งหน้า -->
<body class="bg-bgDark text-white font-sans min-h-screen flex flex-col justify-between selection:bg-emerald-500 selection:text-black">
 
  <!-- แถบเมนูด้านบน (Navbar) -->
  <header class="w-full max-w-6xl mx-auto px-6 py-8 flex items-center justify-between">
    <!-- โลโก้ทางซ้าย -->
    <a href="#" class="text-xl md:text-2xl font-extrabold tracking-tight flex items-center gap-1">
      <span class="text-emerald-400">&gt;_</span><span>Anucha SAU</span>
    </a>
 
    <!-- เมนูนำทางและปุ่มทางขวา -->
    <nav class="flex items-center gap-8">
      <!-- ซ่อนเมนูลิงก์ในหน้าจอมือถือ (แสดงเฉพาะหน้าจอ md ขึ้นไป) -->
      <ul class="hidden md:flex items-center gap-8 text-sm font-medium text-gray-300">
        <li><a href="#" class="hover:text-white transition text-yellow-400">Home</a></li>
        <li><a href="#" class="hover:text-white transition">About</a></li>
        <li><a href="#" class="hover:text-white transition">Portfolio</a></li>
      </ul>
      
      <!-- ✅ แก้ไขลิงก์ตรงนี้: เปลี่ยนให้คลิกปุ่ม Let's talk แล้วไปหน้า index3.html -->
      <a href="index3.html" class="px-5 py-2 text-sm font-medium border border-gray-400 rounded-full hover:border-white hover:bg-white hover:text-black transition duration-200">
        Let's talk
      </a>
    </nav>
  </header>
 
  <!-- ส่วนเนื้อหาหลัก (Hero Section) -->
  <main class="w-full max-w-6xl mx-auto px-6 py-12 md:py-16 flex-1 flex flex-col justify-center">
    <div class="flex flex-col-reverse md:flex-row items-center justify-between gap-12 lg:gap-16">
      
      <!-- ข้อความแนะนำตัวด้านซ้าย -->
      <div class="flex-1 text-center md:text-left space-y-6">
        <h1 class="font-lora font-bold text-[42px] sm:text-[50px] leading-tight text-white tracking-normal">
          Full Stack Web<br />Developer !
        </h1>
        <p class="text-gray-400 text-sm md:text-base max-w-md mx-auto md:mx-0 leading-relaxed font-normal">
          Hi, I'm Anucha Saelim SAU. A passionate Full Stack Web Developer based in Thailand.
        </p>
 
        <!-- ไอคอนโซเชียลมีเดีย -->
        <div class="flex items-center justify-center md:justify-start gap-4 pt-2">
          <a href="#" target="_blank" class="text-white hover:text-white transition text-2xl" title="LinkedIn">
            <i class="fa-brands fa-linkedin"></i>
          </a>
          <a href="#" target="_blank" class="text-white hover:text-white transition text-2xl" title="GitHub">
            <i class="fa-brands fa-github"></i>
          </a>
        </div>
      </div>
 
      <!-- รูปภาพด้านขวาพร้อมพื้นหลังแบบไล่สี -->
      <div class="flex-shrink-0 relative">
        <div class="w-64 h-64 sm:w-80 sm:h-80 lg:w-96 lg:h-96 rounded-full bg-gradient-to-br from-[#c89874] to-[#a06846] flex items-center justify-center overflow-hidden shadow-2xl">
          <img src="./images/p2.png" alt="Avatar" class="w-full h-full object-cover object-center"  />
        </div>
      </div>
 
    </div>
  </main>

  <footer class="w-full max-w-4xl mx-auto px-6 pb-12 pt-6 text-center">
    <h2 class="text-sm font-semibold tracking-wide text-gray-200 mb-8">
      My Tech Stacks
    </h2>
 
    <!-- ไอคอนโปรแกรมต่างๆ จัดเรียงแบบยืดหยุ่น -->
    <div class="flex flex-wrap items-center justify-center gap-6 sm:gap-8">
      <img src="./images/b1.png" alt="HTML5" class="w-10 h-10 object-contain hover:scale-110 transition duration-200" />
      <img src="./images/b2.png" alt="CSS3" class="w-10 h-10 object-contain hover:scale-110 transition duration-200" />
      <img src="./images/b3.png" alt="JavaScript" class="w-10 h-10 object-contain hover:scale-110 transition duration-200" />
      <img src="./images/b4.png" alt="Node.js" class="w-10 h-10 object-contain hover:scale-110 transition duration-200" />
      <img src="./images/b5.png" alt="React" class="w-10 h-10 object-contain hover:scale-110 transition duration-200" />
      <img src="./images/b6.png" alt="Spring" class="w-10 h-10 object-contain hover:scale-110 transition duration-200" />
      <img src="./images/b7.png" alt="Java" class="w-10 h-10 object-contain hover:scale-110 transition duration-200" />
      <img src="./images/b8.png" alt="Figma" class="w-10 h-10 object-contain hover:scale-110 transition duration-200" />
      <img src="./images/b9.png" alt="Firebase" class="w-10 h-10 object-contain hover:scale-110 transition duration-200" />
    </div>
  </footer>
 
</body>
</html>
